name: Deploy to Azure Kubernetes Service (AKS)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  RESOURCE_GROUP: nomad_cluster_group
  CLUSTER_NAME: nomad_cluster
  ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
  SERVICE_NAME: productinventory

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Access Token
        id: acr-token
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME || '00000000-0000-0000-0000-000000000000' }}
          password: ${{ secrets.AZURE_ACR_PASSWORD || steps.acr-token.outputs.token }}

      - name: Build and Push Image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Deploy to AKS
        run: |
          sed -i 's|image: .*|image: '"${{ env.ACR_NAME }}"'.azurecr.io/'"${{ env.SERVICE_NAME }}"':'"${{ github.sha }}"'|g' deployment.yaml
          kubectl apply -f deployment.yaml
