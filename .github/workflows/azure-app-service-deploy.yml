name: Deploy Container to Azure App Service

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
  SERVICE_NAME: productinventory
  APP_SERVICE_NAME: ${{ vars.AZURE_APP_SERVICE_NAME || secrets.AZURE_APP_SERVICE_NAME || github.event.repository.name }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'nomad_cluster_group' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sanitize App Service Name
        run: |
          RAW_NAME="${{ env.APP_SERVICE_NAME }}"
          CLEAN_BASE=$(echo "$RAW_NAME" | tr '_' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g' | cut -c1-38 | sed 's/^-//;s/-$//')
          if [ -z "${{ vars.AZURE_APP_SERVICE_NAME }}" ] && [ -z "${{ secrets.AZURE_APP_SERVICE_NAME }}" ]; then
            REPO_HASH=$(echo -n "${{ github.repository }}" | sha256sum | cut -c1-6)
            SAN_APP_NAME="${CLEAN_BASE}-${REPO_HASH}"
          else
            SAN_APP_NAME="$CLEAN_BASE"
          fi
          echo "APP_SERVICE_NAME=$SAN_APP_NAME" >> $GITHUB_ENV

      - name: Ensure Resource Group, App Service Plan & Web App exist
        run: |
          az group show --name ${{ env.RESOURCE_GROUP }} > /dev/null 2>&1 || az group create --name ${{ env.RESOURCE_GROUP }} --location eastus
          az appservice plan show --name appmod-service-plan --resource-group ${{ env.RESOURCE_GROUP }} > /dev/null 2>&1 || \
          az appservice plan create --name appmod-service-plan --resource-group ${{ env.RESOURCE_GROUP }} --sku B1 --is-linux --location eastus
          
          az webapp show --name ${{ env.APP_SERVICE_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} > /dev/null 2>&1 || \
          az webapp create --name ${{ env.APP_SERVICE_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --plan appmod-service-plan --container-image-name ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:latest

      - name: Get ACR Access Token
        id: acr-token
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME || '00000000-0000-0000-0000-000000000000' }}
          password: ${{ secrets.AZURE_ACR_PASSWORD || steps.acr-token.outputs.token }}

      - name: Build and Push Image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Display Application URL
        run: |
          WEBAPP_HOST=$(az webapp show --name ${{ env.APP_SERVICE_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query defaultHostName -o tsv)
          echo "=================================================="
          echo "Application deployed successfully!"
          echo "URL: https://$WEBAPP_HOST"
          echo "=================================================="
          echo "### 🚀 Azure App Service Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Successfully Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Application URL:** https://$WEBAPP_HOST" >> $GITHUB_STEP_SUMMARY

