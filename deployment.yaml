apiVersion: apps/v1
kind: Deployment
metadata:
  name: productinventory-dev-deployment
  namespace: default
  labels:
    app: productinventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productinventory
  template:
    metadata:
      labels:
        app: productinventory
    spec:
      automountServiceAccountToken: false
      containers:
      - name: productinventory
        image: 123456789012.dkr.ecr.us-east-2.amazonaws.com/productinventory:${{ github.sha }}
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: 1024Mi
          requests:
            cpu: "250m"
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: productinventory-dev-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: productinventory
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
